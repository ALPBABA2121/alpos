<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Alps Dashboard</title>
<script src="topbar.js" defer></script>
<style>
:root {
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger: #FF6B6B;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #050506;
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(224, 118, 88, 0.16), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180, 180, 200, 0.06), transparent 50%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}

.page {
  max-width: 1100px;
  margin: 0 auto;
}

.dash-title {
  margin: 0 0 14px;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

/* ===== Bento grid ===== */
.bento {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 168px;
  gap: 14px;
  grid-auto-flow: dense;
}
.tile {
  --accent: var(--success);
  position: relative;
  display: flex; flex-direction: column;
  padding: 18px 20px;
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  color: var(--text-primary);
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}
.tile.big  { grid-column: span 2; grid-row: span 2; }
.tile.wide { grid-column: span 2; }

.tile:hover,
.tile:focus-visible {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  background: rgba(255, 255, 255, 0.055);
  outline: none;
}

.tile-num {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--text-tertiary);
}
.tile-emoji {
  position: absolute; top: 16px; right: 18px;
  font-size: 26px; line-height: 1;
  filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 70%, transparent));
}
.tile.big .tile-emoji { font-size: 40px; top: 18px; right: 20px; }

.tile-spacer { flex: 1; }

.tile-title {
  font-size: 19px; font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.tile.big .tile-title { font-size: 30px; letter-spacing: -0.03em; }

.tile-foot {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
}
.tile-sub {
  font-size: 13px;
  color: var(--text-tertiary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tile-arrow {
  color: var(--accent);
  font-size: 16px; font-weight: 700;
  transition: transform 0.2s ease;
}
.tile:hover .tile-arrow,
.tile:focus-visible .tile-arrow { transform: translateX(4px); }

@media (prefers-reduced-motion: reduce) {
  body::before { animation: none; }
  .tile, .tile-arrow { transition: none; }
}

@media (max-width: 720px) {
  .bento { grid-template-columns: repeat(2, 1fr); }
  .tile.big { grid-row: span 1; }
  .tile.big .tile-title { font-size: 24px; }
  .tile.big .tile-emoji { font-size: 30px; }
}
@media (max-width: 440px) {
  .bento { grid-template-columns: 1fr; }
  .tile.big, .tile.wide { grid-column: span 1; }
}
</style>
</head>
<body>
<main class="page">
  <h1 class="dash-title">Dashboard</h1>

  <nav class="bento" aria-label="Dashboard pages">
    <a class="tile big" href="main.html" style="--accent:#6BE3A4">
      <span class="tile-num">·01</span>
      <span class="tile-emoji" aria-hidden="true">🏠</span>
      <span class="tile-spacer"></span>
      <span class="tile-title">Main</span>
      <span class="tile-foot"><span class="tile-sub">Goals &amp; daily plan</span><span class="tile-arrow" aria-hidden="true">→</span></span>
    </a>

    <a class="tile wide" href="gym.html" style="--accent:#7DD3FC">
      <span class="tile-num">·02</span>
      <span class="tile-emoji" aria-hidden="true">💪</span>
      <span class="tile-spacer"></span>
      <span class="tile-title">Fitness</span>
      <span class="tile-foot"><span class="tile-sub">Workouts, splits, sessions</span><span class="tile-arrow" aria-hidden="true">→</span></span>
    </a>

    <a class="tile" href="health.html" style="--accent:#A7F3D0">
      <span class="tile-num">·03</span>
      <span class="tile-emoji" aria-hidden="true">💊</span>
      <span class="tile-spacer"></span>
      <span class="tile-title">Health</span>
      <span class="tile-foot"><span class="tile-sub">Supplements &amp; vitals</span><span class="tile-arrow" aria-hidden="true">→</span></span>
    </a>

    <a class="tile" href="po-water.html" style="--accent:#60A5FA">
      <span class="tile-num">·04</span>
      <span class="tile-emoji" aria-hidden="true">💧</span>
      <span class="tile-spacer"></span>
      <span class="tile-title">Water</span>
      <span class="tile-foot"><span class="tile-sub">Hydration</span><span class="tile-arrow" aria-hidden="true">→</span></span>
    </a>

    <a class="tile wide" href="finance.html" style="--accent:#F2C063">
      <span class="tile-num">·05</span>
      <span class="tile-emoji" aria-hidden="true">📊</span>
      <span class="tile-spacer"></span>
      <span class="tile-title">Finance</span>
      <span class="tile-foot"><span class="tile-sub">Net worth &amp; spending</span><span class="tile-arrow" aria-hidden="true">→</span></span>
    </a>
  </nav>
</main>
</body>
</html>
