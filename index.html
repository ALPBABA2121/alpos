<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="lock.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0E0C">
<title>Alps Dashboard</title>
<script src="topbar.js" defer></script>
<style>
:root {
  --text-primary: #EDE6D8;
  --text-secondary: #B5AD9F;
  --text-tertiary: #7D766A;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #0F0E0C;
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 80px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: -2;
  animation: drift 60s ease-in-out infinite alternate;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-size: 3px 3px;
  pointer-events: none;
  z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}

.page {
  max-width: 1040px;
  margin: 0 auto;
  padding-top: clamp(20px, 6vh, 64px);
}

/* ===== Masthead ===== */
.masthead {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  padding-bottom: 22px;
  margin-bottom: 34px;
  border-bottom: 1px solid var(--lux-line, rgba(237,230,216,0.07));
}
.greeting {
  margin: 0 0 10px;
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--lux-gold, #C9A96E);
}
.dash-title { margin: 0; }
.masthead-right {
  display: flex; align-items: center; gap: 18px;
}
.lock-btn {
  padding: 7px 16px;
  border: 1px solid rgba(201, 169, 110, 0.35);
  border-radius: 999px;
  background: transparent;
  color: var(--text-secondary);
  font: inherit; font-size: 10px; font-weight: 600;
  letter-spacing: 0.24em; text-transform: uppercase;
  cursor: pointer;
  transition: background 0.3s, border-color 0.3s, color 0.3s;
}
.lock-btn:hover { background: rgba(201, 169, 110, 0.10); border-color: rgba(201, 169, 110, 0.7); color: var(--text-primary); }
.date {
  font-family: var(--lux-serif, Georgia, serif);
  font-style: italic;
  font-size: 18px;
  color: var(--text-tertiary);
}

/* ===== Bento grid ===== */
.bento {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 168px;
  gap: 14px;
  grid-auto-flow: dense;
}
.tile {
  position: relative;
  display: flex; flex-direction: column;
  padding: 22px 24px;
  border-radius: 18px;
  border: 1px solid rgba(237, 230, 216, 0.07);
  background: linear-gradient(160deg, rgba(237,230,216,0.045) 0%, rgba(237,230,216,0.015) 100%);
  backdrop-filter: blur(24px) saturate(1.1);
  -webkit-backdrop-filter: blur(24px) saturate(1.1);
  color: var(--text-primary);
  text-decoration: none;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
              border-color 0.5s ease, background 0.5s ease;
}
/* A soft champagne light that fades in on hover. */
.tile::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 85% 0%, rgba(201,169,110,0.12), transparent 60%);
  opacity: 0;
  transition: opacity 0.6s ease;
  pointer-events: none;
}
.tile.big  { grid-column: span 2; grid-row: span 2; padding: 30px 32px; }
.tile.wide { grid-column: span 2; }

.tile:hover,
.tile:focus-visible {
  transform: translateY(-3px);
  border-color: rgba(201, 169, 110, 0.32);
}
.tile:hover::before,
.tile:focus-visible::before { opacity: 1; }

.tile-num {
  font-family: var(--lux-serif, Georgia, serif);
  font-size: 15px; font-weight: 500;
  letter-spacing: 0.12em;
  color: var(--lux-gold, #C9A96E);
}
.tile-spacer { flex: 1; }

.tile-title {
  font-family: var(--lux-serif, Georgia, serif);
  font-size: 30px; font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1;
  margin-bottom: 10px;
}
.tile.big .tile-title { font-size: clamp(44px, 6vw, 64px); margin-bottom: 14px; }

.tile-foot {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
  padding-top: 12px;
  border-top: 1px solid rgba(237, 230, 216, 0.06);
}
.tile-sub {
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-tertiary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tile-arrow {
  display: inline-block;
  width: 26px; height: 1px;
  background: var(--lux-gold, #C9A96E);
  position: relative;
  flex-shrink: 0;
  opacity: 0.7;
  transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
}
.tile-arrow::after {
  content: '';
  position: absolute; right: 0; top: -3px;
  width: 6px; height: 6px;
  border-top: 1px solid var(--lux-gold, #C9A96E);
  border-right: 1px solid var(--lux-gold, #C9A96E);
  transform: rotate(45deg);
}
.tile:hover .tile-arrow,
.tile:focus-visible .tile-arrow { width: 40px; opacity: 1; }

.tile.big .tile-lede {
  max-width: 34ch;
  margin: 0 0 20px;
  font-family: var(--lux-serif, Georgia, serif);
  font-style: italic;
  font-size: 19px;
  line-height: 1.4;
  color: var(--text-secondary);
}

@media (prefers-reduced-motion: reduce) {
  body::before { animation: none; }
  .tile, .tile::before, .tile-arrow { transition: none; }
}

@media (max-width: 720px) {
  .bento { grid-template-columns: repeat(2, 1fr); }
  .tile.big { grid-row: span 1; padding: 22px 24px; }
  .tile.big .tile-title { font-size: 40px; margin-bottom: 10px; }
  .tile.big .tile-lede { display: none; }
}
@media (max-width: 440px) {
  .bento { grid-template-columns: 1fr; }
  .tile.big, .tile.wide { grid-column: span 1; }
  .masthead { margin-bottom: 24px; }
}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<main class="page">
  <header class="masthead">
    <div>
      <p class="greeting" id="greeting">Welcome back</p>
      <h1 class="dash-title">Dashboard</h1>
    </div>
    <div class="masthead-right">
      <div class="date" id="today"></div>
      <button class="lock-btn" type="button" onclick="AlpsLock.lock()" title="Lock (Ctrl/Cmd + Shift + L)">Lock</button>
    </div>
  </header>

  <nav class="bento" aria-label="Dashboard pages">
    <a class="tile big" href="main.html">
      <span class="tile-num">I</span>
      <span class="tile-spacer"></span>
      <span class="tile-title">Main</span>
      <p class="tile-lede">Your goals, your plan, and the day ahead — in one quiet place.</p>
      <span class="tile-foot"><span class="tile-sub">Goals &amp; daily plan</span><span class="tile-arrow" aria-hidden="true"></span></span>
    </a>

    <a class="tile wide" href="gym.html">
      <span class="tile-num">II</span>
      <span class="tile-spacer"></span>
      <span class="tile-title">Fitness</span>
      <span class="tile-foot"><span class="tile-sub">Workouts, splits, sessions</span><span class="tile-arrow" aria-hidden="true"></span></span>
    </a>

    <a class="tile" href="health.html">
      <span class="tile-num">III</span>
      <span class="tile-spacer"></span>
      <span class="tile-title">Health</span>
      <span class="tile-foot"><span class="tile-sub">Supplements &amp; vitals</span><span class="tile-arrow" aria-hidden="true"></span></span>
    </a>

    <a class="tile" href="po-water.html">
      <span class="tile-num">IV</span>
      <span class="tile-spacer"></span>
      <span class="tile-title">Water</span>
      <span class="tile-foot"><span class="tile-sub">Hydration</span><span class="tile-arrow" aria-hidden="true"></span></span>
    </a>

    <a class="tile wide" href="finance.html">
      <span class="tile-num">V</span>
      <span class="tile-spacer"></span>
      <span class="tile-title">Finance</span>
      <span class="tile-foot"><span class="tile-sub">Net worth &amp; spending</span><span class="tile-arrow" aria-hidden="true"></span></span>
    </a>

    <a class="tile" href="sleep.html">
      <span class="tile-num">VI</span>
      <span class="tile-spacer"></span>
      <span class="tile-title">Sleep</span>
      <span class="tile-foot"><span class="tile-sub">Bedtime &amp; duration</span><span class="tile-arrow" aria-hidden="true"></span></span>
    </a>

    <a class="tile" href="reading.html">
      <span class="tile-num">VII</span>
      <span class="tile-spacer"></span>
      <span class="tile-title">Reading</span>
      <span class="tile-foot"><span class="tile-sub">Books &amp; pages</span><span class="tile-arrow" aria-hidden="true"></span></span>
    </a>
  </nav>
</main>

<script>
(function () {
  var now = new Date();
  var h = now.getHours();
  var part = h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  document.getElementById('greeting').textContent = part + ', Alp';
  document.getElementById('today').textContent =
    now.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
})();
</script>
</body>
</html>
